function render(){
 flights.forEach(f=>{if(!f.gateOpen)f.arrived=0});
 $('#flight-grid').innerHTML=flights.map(f=>{const pct=Math.round(f.arrived/f.expected*100),minutes=Math.ceil((f.departure-Date.now())/60000),status=f.highlight?'Gate closing':f.gateOpen?'Gate open':'Gate not open',statusClass=f.highlight?'closing':f.gateOpen?'open':'scheduled';return '<section class="card flight-tile'+(f.highlight?' highlighted':'')+'" aria-label="Flight '+f.code+'"><div class="flight-header"><div class="flight-code">'+f.code+'<small class="airline-name">'+f.airline+'</small><small>Singapore → '+f.destination+'</small></div><div class="gate">GATE<b>'+f.gate+'</b></div></div><div class="hero-body"><div class="route"><div>SIN <span>→</span> <b>'+f.airport+' · '+f.destination.toUpperCase()+'</b></div><div class="etd">Departure <b>'+shortFmt.format(f.departure)+'</b> · SGT</div></div><div class="flight-status '+statusClass+'"><i></i>'+status+'</div><div class="count-title"><i class="signal"></i>Passengers at gate</div><div class="count"><span>'+f.arrived+'</span><small>PAX</small></div><div class="progress-heading"><span>Arrived / expected</span><b>'+pct+'%</b></div><div class="track"><div class="bar" style="width:'+pct+'%"></div></div><div class="metrics"><div><small>EXPECTED</small><strong>'+f.expected+'</strong><span>Passengers</span></div><div class="remaining"><small>NOT YET AT GATE</small><strong>'+(f.expected-f.arrived)+'</strong><span>Passengers</span></div></div></div></section>'}).join('');
 document.querySelectorAll('[data-arrival]').forEach(b=>b.onclick=()=>record(b.dataset.arrival,true));
 if($('#flight-select'))$('#flight-select').innerHTML=flights.map(x=>'<option value="'+x.code+'"'+(x.code===selected?' selected':'')+'>'+x.code+'</option>').join('');
 if($('#add'))$('#add').disabled=flights.find(f=>f.code===selected).arrived>=flights.find(f=>f.code===selected).expected;
}
function record(code=selected,notify=false){const f=flights.find(f=>f.code===code);if(!f||f.arrived>=f.expected||!f.gateOpen)return false;f.arrived++;f.events.unshift({time:new Date(),ref:f.code+'-'+String(f.arrived).padStart(4,'0')});f.events=f.events.slice(0,4);render();if(notify){clearTimeout(toastTimer);$('#toast').textContent='Passenger recorded for '+f.code+' · '+f.arrived+' PAX at gate';$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2500)}return true}
function clock(){$('#clock').textContent=timeFmt.format(new Date());$('#date').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Singapore',day:'2-digit',month:'short',year:'numeric'}).format(new Date())+' · SINGAPORE · CHANGI'}
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#toast').textContent='Use your browser’s full-screen command';$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2500)}};setInterval(()=>{if(!automatic||document.hidden)return;const eligible=flights.filter(f=>!f.highlight&&f.arrived<f.expected);if(eligible.length)record(eligible[Math.floor(Math.random()*eligible.length)].code)},4500);setInterval(()=>{if(!automatic||document.hidden)return;[4,6,8].forEach(i=>{const f=flights[i];if(f&&f.arrived<f.expected)record(f.code)})},1500);setInterval(()=>{const now=Date.now();if(flights.length&&flights[0].departure.getTime()<now+15*60000){flights.forEach(f=>f.departure=new Date(f.departure.getTime()+10*60000));render()}else render()},30000);setInterval(clock,1000);clock();init();
</script><!-- Singapore departure display with illustrative departure times relative to the current Singapore time, sample gate numbers and simulated passenger counts. Not a live flight feed. --></body></html>
